<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSCC — Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#ECEEE9; --green-1:#4C5F49; --green-2:#6E7D66; --sage:#9AA696; --line:#cfd3cb; --cream:#ECEEE9; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--green-1);font-family:'Space Mono',monospace;padding:28px 20px 70px;line-height:1.5;}
  .wrap{max-width:700px;margin:0 auto;}
  .eyebrow{font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:var(--green-2);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(40px,11vw,66px);line-height:0.92;text-transform:uppercase;letter-spacing:0.01em;margin-bottom:6px;}
  .sub{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--green-2);margin-bottom:26px;}
  .prog-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--green-2);margin-bottom:8px;}
  .prog-pct{font-weight:700;color:var(--green-1);font-size:13px;}
  .bar{height:6px;background:#dfe2dc;border:1px solid var(--line);position:relative;overflow:hidden;margin-bottom:36px;}
  .bar-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green-1);transition:width .35s cubic-bezier(.4,0,.2,1);}
  .sec{margin-bottom:30px;}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:0.04em;}
  .sec-head .num{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--green-2);letter-spacing:0.15em;}
  .sec-head .ln{flex:1;height:1px;background:var(--line);}
  ul{list-style:none;}
  li{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;}
  li:last-child{border-bottom:none;}
  .box{flex:0 0 auto;width:18px;height:18px;border:1.5px solid var(--green-2);margin-top:2px;position:relative;transition:background .15s,border-color .15s;}
  .box::after{content:'';position:absolute;left:4px;top:0;width:6px;height:11px;border:solid var(--cream);border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .15s;}
  li.done .box{background:var(--green-1);border-color:var(--green-1);}
  li.done .box::after{transform:rotate(45deg) scale(1);}
  .id{flex:0 0 auto;font-size:10px;color:var(--sage);letter-spacing:0.1em;margin-top:3px;min-width:26px;}
  .txt{font-size:13.5px;letter-spacing:0.01em;transition:color .15s,opacity .15s;}
  li.done .txt{color:var(--green-2);opacity:.5;text-decoration:line-through;}
  .txt .opt{font-size:10px;color:var(--sage);letter-spacing:0.14em;text-transform:uppercase;margin-left:6px;}
  /* showcase: la sezione "Già fatto" mostra le spunte come traguardi, non barrate */
  .done-sec .sec-head{color:var(--green-1);}
  .done-sec li.done .txt{color:var(--green-1);opacity:1;text-decoration:none;}
  .footer{margin-top:36px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--green-2);}
  .reset{background:none;border:1px solid var(--line);color:var(--green-2);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;padding:7px 12px;cursor:pointer;transition:.15s;}
  .reset:hover{border-color:var(--green-2);color:var(--green-1);}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow"><span>NSCC</span><span>Ride · Aperitivo · DJ Set</span></div>
  <h1>Checklist<br>Progetto</h1>
  <div class="sub">Opening Ride · Sab 20 giugno 2026 · Sondrio, IT</div>

  <div class="prog-row"><span>Avanzamento</span><span class="prog-pct" id="pct">0%</span></div>
  <div class="bar"><div class="bar-fill" id="fill"></div></div>

  <div id="list"></div>

  <div class="footer">
    <span id="count">0 / 0</span>
    <button class="reset" id="reset">Azzera spunte da fare</button>
  </div>
</div>

<script>
const KEY = 'nscc_checklist_v2';

// {n: prefisso id + numero mostrato, title, done?: pre-flaggato (showcase), items:["testo|opzionale"]}
const DATA = [
  {n:'0', label:'\u2713', title:'Già fatto', done:true, items:[
    "Piano di lancio completo (brand, Instagram, evento, timeline)",
    "Profilo Instagram @northsidecc_ attivo",
    "Sito web online \u2014 northsidecc.com (hero, manifesto, how, behind, more-than, join, footer)",
    "Pagine sito: merch (Drop 001), join, privacy, cookies, link-in-bio",
    "Anteprima condivisione (meta/OG + favicon) e pagine legali vere",
    "Sezione Opening Ride sul sito con mappa del giro (GPX)",
    "Link Strava ufficiali + Instagram sistemati su tutto il sito",
    "Sito ottimizzato per mobile + foto merch in PNG (senza sfondo)",
    "Data evento fissata: sabato 20 giugno 2026, Sondrio",
    "Checklist di progetto (questa)",
  ]},
  {n:'1', title:'Brand & identità', items:[
    "Parlare con Enni in settimana per nuove proposte (brand/identità)",
    "Foto founders (Behind): da rifare",
    "Banca foto/video del club (ride, lifestyle, ritratti)",
    "Bio standard + tone of voice (uguale su sito, IG, email)",
    "Fare gli adesivi (formato, quantità, fornitore)",
    "Welcome kit / tessera membro|opz.",
  ]},
  {n:'2', title:'Sito web', items:[
    "Verificare/finire le pagine prodotto (tee / socks / bidon) e i link",
    "Pagina iscrizione (Join) funzionante \u2014 verificare se arriva la mail",
    "Controllo link ovunque (Strava, IG, email)",
    "Creare l\u2019evento Strava e cambiare il link sul sito una volta fatto",
    "Test completo da telefono",
  ]},
  {n:'3', title:'Merch / prodotto', items:[
    "Vedere i sample",
    "Confermare fornitore: prezzi, minimi d\u2019ordine, tempi",
    "Decidere taglie e quantità del primo drop",
    "All\u2019evento: regalare i bidon + noi in maglia; se la vogliono \u2192 preorder per il drop",
    "Eventuale packaging",
  ]},
  {n:'4', title:'Evento \u2014 Opening Ride (20 giugno)', items:[
    "Orario + punto di ritrovo esatto a Sondrio",
    "Percorso definitivo \u2192 caricarlo come Route su Strava",
    "Evento RSVP su Strava (club + evento)",
    "Contattare il bar per l\u2019aperitivo (posti, orario, menu, costo)",
    "DJ set: sentire Enni",
    "Totem o altro alla ride? Qualcosa per fare branding",
    "Capo-gruppo + ritmo no-drop + \u201cscopa\u201d dietro",
    "Stima partecipanti (serve a bar, logistica, merch)",
    "Piano B meteo",
  ]},
  {n:'5', title:'Legale / sicurezza / assicurazione', items:[
    "Sentire l\u2019avvocato per l\u2019assicurazione (responsabilità sulle uscite)",
    "Liberatoria/waiver per i partecipanti se necessarie (vedere One Million Ride)",
    "Serve una forma giuridica? (es. ASD / tesseramento per coprire le ride)",
    "Permessi: ritrovo/suolo pubblico, musica del DJ (SIAE)",
  ]},
  {n:'6', title:'Comunicazione & lancio', items:[
    "Mandare il messaggio di lancio (IG, Strava, sistemare sito)",
    "Data e ordine d\u2019uscita dei post IG (standby \u2014 layout e post con Enni)",
    "Aprire il gruppo WhatsApp della community|tbd",
    "Volantino + adesivi in bar / bike shop / palestre|tbd",
  ]},
  {n:'7', title:'Giorno dell\u2019evento', items:[
    "Qualcuno dedicato a foto/video",
    "Punto di ritrovo riconoscibile",
    "Storia taggandoci \u2192 bidon in regalo // oppure: follow IG + iscritti gruppo Strava",
    "Regalare adesivi",
  ]},
  {n:'8', title:'Dopo l\u2019evento', items:[
    "Post IG di ringraziamento + recap (foto/video)",
  ]},
  {n:'9', title:'Più avanti (crescita)', items:[
    "Calendario ride ricorrenti",
    "Pianificare la ride #002 / calendario uscite",
    "Collaborazioni (bike shop, bar, brand locali)",
    "Membership / tesseramento",
    "Ampliare il merch",
  ]},
];

let state = {};

function loadState(){
  try{ const raw = localStorage.getItem(KEY); if(raw) state = JSON.parse(raw); }catch(e){ state = {}; }
}
function saveState(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function isChecked(sec, id){
  if(Object.prototype.hasOwnProperty.call(state, id)) return !!state[id];
  return !!sec.done;
}

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  DATA.forEach(sec=>{
    const wrap = document.createElement('div'); wrap.className = 'sec' + (sec.done?' done-sec':'');
    const head = document.createElement('div'); head.className='sec-head';
    head.innerHTML = `<span class="num">${(sec.label||sec.n.padStart(2,'0'))}</span><span>${sec.title}</span><span class="ln"></span>`;
    wrap.appendChild(head);
    const ul = document.createElement('ul');
    sec.items.forEach((raw, ii)=>{
      const parts = raw.split('|'); const text = parts[0]; const opt = parts[1];
      const id = `${sec.n}.${ii+1}`;
      const li = document.createElement('li'); li.dataset.id = id;
      if(isChecked(sec,id)) li.classList.add('done');
      const idLabel = sec.done ? '' : `<span class="id">${id}</span>`;
      li.innerHTML = `<span class="box"></span>${idLabel}<span class="txt">${text}${opt?`<span class="opt">${opt}</span>`:''}</span>`;
      li.addEventListener('click', ()=>{ const cur = isChecked(sec,id); state[id] = !cur; li.classList.toggle('done', !cur); saveState(); updateProgress(); });
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
    list.appendChild(wrap);
  });
  updateProgress();
}

function updateProgress(){
  let total=0, done=0;
  DATA.forEach(sec=>sec.items.forEach((_,ii)=>{ total++; if(isChecked(sec, `${sec.n}.${ii+1}`)) done++; }));
  const pct = total? Math.round(done/total*100):0;
  document.getElementById('pct').textContent = pct+'%';
  document.getElementById('fill').style.width = pct+'%';
  document.getElementById('count').textContent = done+' / '+total;
}

document.getElementById('reset').addEventListener('click', ()=>{
  if(confirm('Azzerare le spunte delle cose DA FARE? (Il blocco \u201cGià fatto\u201d resta)')){
    DATA.forEach(sec=>{ if(!sec.done) sec.items.forEach((_,ii)=>{ delete state[`${sec.n}.${ii+1}`]; }); });
    saveState(); render();
  }
});

loadState();
render();
</script>
</body>
</html>
